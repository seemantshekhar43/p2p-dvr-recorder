name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  amd64:
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends zlib1g-dev
      - run: swift test
      - run: swift build -c release --static-swift-stdlib --product nvr-tunnel
      - run: cp .build/release/nvr-tunnel nvr-tunnel-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: nvr-tunnel-linux-amd64
          path: nvr-tunnel-linux-amd64
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nvr-tunnel-linux-amd64

  # Arm runners are free only for public repos, so skip this job while the repo is private.
  arm64:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends zlib1g-dev
      - run: swift test
      - run: swift build -c release --static-swift-stdlib --product nvr-tunnel
      - run: cp .build/release/nvr-tunnel nvr-tunnel-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: nvr-tunnel-linux-arm64
          path: nvr-tunnel-linux-arm64
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nvr-tunnel-linux-arm64
