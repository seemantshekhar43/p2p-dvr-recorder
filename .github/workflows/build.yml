name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # Arm runners are free only for public repos.
          - arch: arm64
            runner: ubuntu-24.04-arm
    # Skip the arm64 build while the repo is private.
    if: matrix.arch == 'amd64' || !github.event.repository.private
    runs-on: ${{ matrix.runner }}
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends zlib1g-dev
      - run: swift test
      - run: swift build -c release --static-swift-stdlib --product nvr-tunnel
      - run: cp .build/release/nvr-tunnel nvr-tunnel-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: nvr-tunnel-linux-${{ matrix.arch }}
          path: nvr-tunnel-linux-${{ matrix.arch }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nvr-tunnel-linux-${{ matrix.arch }}
